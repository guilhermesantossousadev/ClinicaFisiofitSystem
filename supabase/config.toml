project_id = "fisiofit-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000/sistema"
additional_redirect_urls = [
  "http://localhost:3000/sistema/**",
  "https://clinicafisiofitsabara.com/sistema/**"
]
jwt_expiry = 3600
enable_signup = false

[auth.mfa]
max_enrolled_factors = 3

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "25MiB"

[storage.vector]
enabled = false

[functions.api]
verify_jwt = true
